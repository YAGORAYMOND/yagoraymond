<script>

const lines = [

    [
        {
            text: "Hi! How are you?"
        }
    ],

    [
        {
            text: "My name is Yago Raymond and I "
        },
        {
            text: "live code music!",
            href: "releases.html"
        }
    ],

    [
        {
            text: "I also made "
        },
        {
            text: "N-ary",
            href: "https://nary.yagoraymond.cat"
        },
        {
            text: ", a live coding environment."
        }
    ],

    [
        {
            text: "Enjoy!"
        }
    ]

];


const lineElements =
    document.querySelectorAll(".terminal-line");

const homeLinks =
    document.getElementById("home-links");

const cursor =
    document.createElement("span");

cursor.className = "terminal-cursor";


function wait(ms) {

    return new Promise(resolve =>
        setTimeout(resolve, ms)
    );

}


/* TEMPS DE TECLEIG MÉS HUMÀ */

function getTypingDelay(character) {

    // base irregular però àgil
    let delay =
        25 + Math.random() * 45;

    // petita pausa entre paraules
    if (character === " ") {
        delay +=
            20 + Math.random() * 55;
    }

    // comes
    if (character === ",") {
        delay +=
            60 + Math.random() * 80;
    }

    // final de frase
    if (
        character === "." ||
        character === "!" ||
        character === "?"
    ) {
        delay +=
            110 + Math.random() * 130;
    }

    // micropausa ocasional
    if (Math.random() < 0.03) {
        delay +=
            60 + Math.random() * 100;
    }

    return delay;
}


/* TYPO OCASIONAL */

const makeTypo =
    Math.random() < 0.25;

let typoDone = false;


const neighbourKeys = {
    a: "s",
    s: "a",
    d: "s",
    f: "d",
    g: "f",
    h: "g",
    j: "h",
    k: "j",
    l: "k",

    q: "w",
    w: "q",
    e: "w",
    r: "e",
    t: "r",
    y: "t",
    u: "y",
    i: "u",
    o: "i",
    p: "o",

    z: "x",
    x: "z",
    c: "x",
    v: "c",
    b: "v",
    n: "b",
    m: "n"
};


async function typeSegment(
    container,
    segment
) {

    // Cada segment té el seu node.
    // Això preserva correctament els links.

    const target =
        segment.href
            ? document.createElement("a")
            : document.createElement("span");


    if (segment.href) {

        target.href =
            segment.href;

    }


    container.appendChild(target);


    for (
        let i = 0;
        i < segment.text.length;
        i++
    ) {

        const character =
            segment.text[i];


        /*
         * Un únic error ocasional.
         * No passa en links ni al principi/final.
         */

        const lower =
            character.toLowerCase();

        const canTypo =
            makeTypo &&
            !typoDone &&
            !segment.href &&
            i > 3 &&
            i < segment.text.length - 3 &&
            neighbourKeys[lower] &&
            Math.random() < 0.035;


        if (canTypo) {

            const wrong =
                neighbourKeys[lower];

            target.textContent +=
                character === character.toUpperCase()
                    ? wrong.toUpperCase()
                    : wrong;

            container.appendChild(cursor);

            await wait(
                150 + Math.random() * 250
            );


            // backspace

            target.textContent =
                target.textContent.slice(0, -1);

            container.appendChild(cursor);

            await wait(
                100 + Math.random() * 140
            );

            typoDone = true;

        }


        // lletra correcta

        target.textContent +=
            character;

        container.appendChild(cursor);


        await wait(
            getTypingDelay(character)
        );

    }

}


async function typeTerminal() {

    // pausa inicial
    await wait(
        400 + Math.random() * 350
    );


    for (
        let lineIndex = 0;
        lineIndex < lines.length;
        lineIndex++
    ) {

        const line =
            lineElements[lineIndex];

        const output =
            line.querySelector(
                ".terminal-output"
            );


        line.classList.add(
            "visible"
        );

        output.appendChild(cursor);


        for (
            const segment
            of lines[lineIndex]
        ) {

            await typeSegment(
                output,
                segment
            );

        }


        if (
            lineIndex <
            lines.length - 1
        ) {

            cursor.remove();

            // pausa irregular abans
            // de començar nova línia

            await wait(
                250 +
                Math.random() * 450
            );

        }

    }


    await wait(
        450 + Math.random() * 300
    );

    homeLinks.classList.add(
        "visible"
    );

}


typeTerminal();
